# Single-page app server behind Container Apps ingress (TLS ends there and at Cloudflare).
# Mirrors frontend/public/staticwebapp.config.json: static files are served as files, every other
# path falls back to index.html so React routes work on reload.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirects stay relative, so the scheme and host of the public URL are kept.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness for the image HEALTHCHECK; not routed to the app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The release planner reads the running commit here; never cache it.
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Missing static files return 404 instead of the app shell (the Static Web Apps exclude list).
    location ~* \.(css|js|mjs|map|json|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
