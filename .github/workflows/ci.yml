name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-infrastructure:
    name: Validate repository infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm required files
        shell: bash
        run: |
          required_files=(
            README.md
            .env.example
            .gitignore
            .dockerignore
            docker-compose.yml
            .github/workflows/ci.yml
            .github/workflows/cd.yml
            ApiGateway/Dockerfile
            services/AuthService/Dockerfile
            services/PatientService/Dockerfile
            services/QueueService/Dockerfile
            services/MedicalRecordService/Dockerfile
            services/PrescriptionService/Dockerfile
            tests/E2ETests/E2ETests.csproj
            deployment/terraform/versions.tf
            deployment/terraform/.terraform.lock.hcl
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Prepare safe validation environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Validate Terraform configuration
        shell: bash
        run: |
          terraform -chdir=deployment/terraform fmt -check -recursive
          terraform -chdir=deployment/terraform init -backend=false -input=false
          terraform -chdir=deployment/terraform validate

  build-and-test:
    name: Build and test .NET projects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MINIMUM_LINE_COVERAGE: "55"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet tool restore
          dotnet restore SwiftCare.slnx

      - name: Verify formatting
        if: hashFiles('SwiftCare.slnx') != ''
        run: dotnet format SwiftCare.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build and test
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet build SwiftCare.slnx --no-restore --configuration Release
          dotnet test tests/AuthService.UnitTests/AuthService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/ApiGateway.UnitTests/ApiGateway.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/PatientService.UnitTests/PatientService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/QueueService.UnitTests/QueueService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/MedicalRecordService.UnitTests/MedicalRecordService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/PrescriptionService.UnitTests/PrescriptionService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
          dotnet test tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Publish test summary
        if: always() && hashFiles('SwiftCare.slnx') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          rows = []
          for path in sorted(glob.glob("TestResults/**/*.trx", recursive=True)):
              root = ET.parse(path).getroot()
              counters = root.find("t:ResultSummary/t:Counters", ns)
              if counters is None:
                  continue
              unit_test = root.find("t:TestDefinitions/t:UnitTest", ns)
              name = os.path.basename(unit_test.get("storage", path)) if unit_test is not None else os.path.basename(path)
              rows.append((name, counters.get("total"), counters.get("passed"), counters.get("failed")))
          print("## Test results\n")
          if not rows:
              print("No test results were produced.")
          else:
              print("| Suite | Total | Passed | Failed |")
              print("| --- | ---: | ---: | ---: |")
              for row in rows:
                  print("| {} | {} | {} | {} |".format(*row))
          PY

      - name: Generate coverage report
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary;Html;SonarQube" \
            -filefilters:"-*/Migrations/*"

      - name: Publish coverage summary
        if: hashFiles('SwiftCare.slnx') != ''
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          coverage=$(jq -r '.summary.linecoverage' TestResults/coverage-report/Summary.json)
          echo "Line coverage: ${coverage}% (minimum ${MINIMUM_LINE_COVERAGE}%)"
          if awk -v c="$coverage" -v m="$MINIMUM_LINE_COVERAGE" 'BEGIN { exit !(c < m) }'; then
            echo "::error::Line coverage ${coverage}% is below the ${MINIMUM_LINE_COVERAGE}% minimum"
            exit 1
          fi

      - name: Upload test results
        if: always() && hashFiles('SwiftCare.slnx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  mutation-testing:
    name: Mutation testing (${{ matrix.service }})
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [ApiGateway, AuthService, MedicalRecordService, NotificationService, PatientService, PrescriptionService, QueueService]
    steps:
      - name: Check out repository and base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run Stryker.NET
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          $since = ''
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $since = "origin/$env:BASE_REF" }
          ./tests/MutationTesting/run-mutation-tests.ps1 -Service ${{ matrix.service }} -Since $since

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.service }}
          path: tests/MutationTesting/results/${{ matrix.service }}/
          if-no-files-found: warn

  sonarqube-analysis:
    name: SonarQube Cloud analysis
    needs: build-and-test
    # The SonarQube Cloud Free plan analyzes only its main branch (develop) and pull requests into it.
    # Fork pull requests are skipped because they do not receive repository secrets.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_SCANNER_VERSION: "11.3.0"
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm SonarQube Cloud configuration
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Repository secret SONAR_TOKEN is not configured"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Repository variable SONAR_ORGANIZATION is not configured"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Repository variable SONAR_PROJECT_KEY is not configured"; exit 1; }

      - name: Set up Java for the scanner
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ env.SONAR_SCANNER_VERSION }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Download .NET coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Confirm SonarQube coverage report
        run: test -s TestResults/coverage-report/SonarQube.xml || { echo "::error::SonarQube coverage report was not produced"; exit 1; }

      - name: Install frontend dependencies for type-aware analysis
        working-directory: frontend
        run: npm ci

      - name: Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION" --tool-path .sonar/scanner

      - name: Analyze and wait for the quality gate
        run: |
          .sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.inclusions="services/**,ApiGateway/**,frontend/**" \
            /d:sonar.exclusions="**/Migrations/**,**/*.Designer.cs,**/*ModelSnapshot.cs,**/*.g.cs,**/*.generated.*,**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/TestResults/**,frontend/package-lock.json,frontend/public/**" \
            /d:sonar.coverageReportPaths="TestResults/coverage-report/SonarQube.xml" \
            /d:sonar.coverage.exclusions="frontend/**,services/*/Data/**" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300
          dotnet build SwiftCare.slnx --configuration Release
          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  build-frontend:
    name: Build and lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, and build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          VITE_GATEWAY_URL: http://localhost:8000
        run: |
          npm ci
          npm run lint
          npm run build

  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs:
      - build-and-test
      - build-frontend
    env:
      AUTH_SEED_PASSWORD: ci-only-e2e-seed-password
      E2E_ALLOW_EMPTY_STATE_SETUP: "true"
      E2E_BASE_URL: http://localhost:5173
      E2E_HEADLESS: "true"
      MYSQL_USER: swiftcare_user
      MYSQL_PASSWORD: ci-only-e2e-db-password
      VITE_GATEWAY_URL: http://localhost:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore E2E test dependencies
        run: dotnet restore tests/E2ETests/E2ETests.csproj

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare E2E environment
        run: cp .env.example .env

      - name: Build backend images
        run: docker compose build authservice patientservice queueservice medicalrecordservice prescriptionservice apigateway

      - name: Start infrastructure and apply migrations
        shell: bash
        run: |
          set -euo pipefail

          docker compose up --detach --wait mysql kafka

          apply_migrations() {
            local service="$1"
            local display_name="$2"
            local migration_succeeded=false

            for attempt in {1..5}; do
              echo "Applying ${display_name} migrations (attempt ${attempt}/5)..."
              if docker compose run --rm --no-deps "$service" --migrate; then
                migration_succeeded=true
                break
              fi

              if [[ "$attempt" -lt 5 ]]; then
                sleep "$((attempt * 5))"
              fi
            done

            if [[ "$migration_succeeded" != "true" ]]; then
              echo "${display_name} migrations failed after 5 attempts."
              return 1
            fi
          }

          apply_migrations authservice AuthService
          apply_migrations patientservice PatientService
          apply_migrations queueservice QueueService
          apply_migrations medicalrecordservice MedicalRecordService
          apply_migrations prescriptionservice PrescriptionService

          docker compose run --rm --no-deps kafka-init

      - name: Start application services
        run: |
          docker compose up --detach --no-build --no-deps --wait --wait-timeout 180 authservice patientservice queueservice medicalrecordservice prescriptionservice
          docker compose up --detach --no-build --no-deps --wait --wait-timeout 180 apigateway

      - name: Run Selenium E2E tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p TestResults/E2E
          npm --prefix frontend run dev -- --host 127.0.0.1 > TestResults/E2E/frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT

          frontend_ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:5173 >/dev/null; then
              frontend_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$frontend_ready" != "true" ]]; then
            echo "Frontend did not become ready within 60 seconds."
            exit 1
          fi

          google-chrome --version
          dotnet test tests/E2ETests/E2ETests.csproj \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults/E2E

      - name: Collect E2E diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p TestResults/E2E
          if [[ -f .env ]]; then
            docker compose ps --all > TestResults/E2E/docker-compose-status.txt 2>&1 || true
            docker compose logs --no-color \
              mysql zookeeper kafka kafka-init \
              authservice patientservice queueservice medicalrecordservice prescriptionservice apigateway \
              > TestResults/E2E/docker-compose.log 2>&1 || true
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/E2E

      - name: Stop E2E environment
        if: always()
        shell: bash
        run: |
          if [[ -f .env ]]; then
            docker compose down --volumes --remove-orphans
          fi

  build-images:
    name: Build deployable images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ApiGateway/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-gateway
          cache-to: type=gha,mode=max,scope=swiftcare-gateway

      - name: Build the AuthService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/AuthService/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-auth
          cache-to: type=gha,mode=max,scope=swiftcare-auth

      - name: Build the PatientService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/PatientService/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-patient
          cache-to: type=gha,mode=max,scope=swiftcare-patient

      - name: Build the QueueService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/QueueService/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-queue
          cache-to: type=gha,mode=max,scope=swiftcare-queue

      - name: Build the MedicalRecordService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/MedicalRecordService/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-medical-record
          cache-to: type=gha,mode=max,scope=swiftcare-medical-record

      - name: Build the PrescriptionService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/PrescriptionService/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=swiftcare-prescription
          cache-to: type=gha,mode=max,scope=swiftcare-prescription

  container-scan:
    name: Scan container image for CVEs (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: ApiGateway/Dockerfile
            scope: swiftcare-gateway
          - service: auth
            dockerfile: services/AuthService/Dockerfile
            scope: swiftcare-auth
          - service: patient
            dockerfile: services/PatientService/Dockerfile
            scope: swiftcare-patient
          - service: queue
            dockerfile: services/QueueService/Dockerfile
            scope: swiftcare-queue
          - service: medical-record
            dockerfile: services/MedicalRecordService/Dockerfile
            scope: swiftcare-medical-record
          - service: prescription
            dockerfile: services/PrescriptionService/Dockerfile
            scope: swiftcare-prescription
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the ${{ matrix.service }} image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: swiftcare-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: swiftcare-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Audit NuGet packages
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet restore SwiftCare.slnx
          report=$(dotnet list SwiftCare.slnx package --vulnerable --include-transitive)
          echo "$report"
          # dotnet list exits 0 even when it finds vulnerabilities, so match on its output.
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Set up Node.js
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm packages
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" -v --redact --exit-code 1

  validate-migrations:
    name: Validate EF Core migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      AUTH_DB_CONNECTION: "Server=127.0.0.1;Port=3306;Database=swiftcare_auth;User Id=root;Password=ci-only-root-password;"
      PATIENT_DB_CONNECTION: "Server=127.0.0.1;Port=3306;Database=swiftcare_patient;User Id=root;Password=ci-only-root-password;"
      QUEUE_DB_CONNECTION: "Server=127.0.0.1;Port=3306;Database=swiftcare_queue;User Id=root;Password=ci-only-root-password;"
      MEDICAL_RECORD_DB_CONNECTION: "Server=127.0.0.1;Port=3306;Database=swiftcare_medical_record;User Id=root;Password=ci-only-root-password;"
      PRESCRIPTION_DB_CONNECTION: "Server=127.0.0.1;Port=3306;Database=swiftcare_prescription;User Id=root;Password=ci-only-root-password;"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: swiftcare_auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -pci-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet tool restore
          dotnet restore SwiftCare.slnx

      # AuthDbContextFactory supplies placeholder design-time credentials and EF prefers it
      # over the application host, so the connection string must be passed explicitly.
      - name: Apply migrations to a clean database
        if: hashFiles('services/AuthService/AuthService.csproj') != ''
        run: dotnet ef database update --project services/AuthService --connection "$AUTH_DB_CONNECTION"

      - name: Check for model changes without a migration
        if: hashFiles('services/AuthService/AuthService.csproj') != ''
        run: dotnet ef migrations has-pending-model-changes --project services/AuthService

      - name: Apply PatientService migrations to a clean database
        if: hashFiles('services/PatientService/PatientService.csproj') != ''
        run: dotnet ef database update --project services/PatientService --connection "$PATIENT_DB_CONNECTION"

      - name: Check PatientService for model changes without a migration
        if: hashFiles('services/PatientService/PatientService.csproj') != ''
        run: dotnet ef migrations has-pending-model-changes --project services/PatientService

      - name: Apply QueueService migrations to a clean database
        if: hashFiles('services/QueueService/QueueService.csproj') != ''
        run: dotnet ef database update --project services/QueueService --connection "$QUEUE_DB_CONNECTION"

      - name: Check QueueService for model changes without a migration
        if: hashFiles('services/QueueService/QueueService.csproj') != ''
        run: dotnet ef migrations has-pending-model-changes --project services/QueueService

      - name: Apply MedicalRecordService migrations to a clean database
        if: hashFiles('services/MedicalRecordService/MedicalRecordService.csproj') != ''
        run: dotnet ef database update --project services/MedicalRecordService --connection "$MEDICAL_RECORD_DB_CONNECTION"

      # Re-applying confirms --migrate is idempotent: no table recreation, no duplicate template rows.
      - name: Re-apply MedicalRecordService migrations to verify idempotency
        if: hashFiles('services/MedicalRecordService/MedicalRecordService.csproj') != ''
        run: dotnet ef database update --project services/MedicalRecordService --connection "$MEDICAL_RECORD_DB_CONNECTION"

      - name: Check MedicalRecordService for model changes without a migration
        if: hashFiles('services/MedicalRecordService/MedicalRecordService.csproj') != ''
        run: dotnet ef migrations has-pending-model-changes --project services/MedicalRecordService

      - name: Apply PrescriptionService migrations to a clean database
        if: hashFiles('services/PrescriptionService/PrescriptionService.csproj') != ''
        run: dotnet ef database update --project services/PrescriptionService --connection "$PRESCRIPTION_DB_CONNECTION"

      - name: Check PrescriptionService for model changes without a migration
        if: hashFiles('services/PrescriptionService/PrescriptionService.csproj') != ''
        run: dotnet ef migrations has-pending-model-changes --project services/PrescriptionService

  code-analysis:
    name: Analyze code (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Must run after init so the CodeQL extractor can trace the compilation.
      - name: Build .NET projects
        if: matrix.language == 'csharp'
        run: dotnet build SwiftCare.slnx --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
