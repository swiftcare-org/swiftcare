name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-infrastructure:
    name: Validate repository infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm required files
        shell: bash
        run: |
          required_files=(
            README.md
            .env.example
            .gitignore
            docker-compose.yml
            .github/workflows/ci.yml
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Prepare safe validation environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

  build-and-test:
    name: Build and test .NET projects
    runs-on: ubuntu-latest
    env:
      MINIMUM_LINE_COVERAGE: "55"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore, build, and test
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet tool restore
          dotnet restore SwiftCare.slnx
          dotnet build SwiftCare.slnx --no-restore --configuration Release
          dotnet test SwiftCare.slnx --no-build --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary;Html" \
            -filefilters:"-*/Migrations/*"

      - name: Publish coverage summary
        if: hashFiles('SwiftCare.slnx') != ''
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          coverage=$(jq -r '.summary.linecoverage' TestResults/coverage-report/Summary.json)
          echo "Line coverage: ${coverage}% (minimum ${MINIMUM_LINE_COVERAGE}%)"
          if awk -v c="$coverage" -v m="$MINIMUM_LINE_COVERAGE" 'BEGIN { exit !(c < m) }'; then
            echo "::error::Line coverage ${coverage}% is below the ${MINIMUM_LINE_COVERAGE}% minimum"
            exit 1
          fi

      - name: Upload test results
        if: always() && hashFiles('SwiftCare.slnx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  build-frontend:
    name: Build and lint frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, and build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  security-scan:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        if: hashFiles('SwiftCare.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Audit NuGet packages
        if: hashFiles('SwiftCare.slnx') != ''
        run: |
          dotnet restore SwiftCare.slnx
          report=$(dotnet list SwiftCare.slnx package --vulnerable --include-transitive)
          echo "$report"
          # dotnet list exits 0 even when it finds vulnerabilities, so match on its output.
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Set up Node.js
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm packages
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high
