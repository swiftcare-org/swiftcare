name: CD

run-name: Deploy SwiftCare to Azure development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_admin:
        description: Create the initial production administrator, then remove the bootstrap job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Every branch deploys to the same development resources. Serializing the whole
# environment prevents two manually selected branches from racing each other.
concurrency:
  group: azure-development-deployment
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/swiftcare-gateway
  AUTH_IMAGE: ghcr.io/${{ github.repository_owner }}/swiftcare-auth
  PATIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/swiftcare-patient
  QUEUE_IMAGE: ghcr.io/${{ github.repository_owner }}/swiftcare-queue

jobs:
  manual-quality-gate:
    name: Run CI for a manually selected branch
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and publish immutable images
    needs: manual-quality-gate
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality-gate.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ApiGateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=swiftcare-gateway
          cache-to: type=gha,mode=max,scope=swiftcare-gateway

      - name: Build and push AuthService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/AuthService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AUTH_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=swiftcare-auth
          cache-to: type=gha,mode=max,scope=swiftcare-auth

      - name: Build and push PatientService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/PatientService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.PATIENT_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=swiftcare-patient
          cache-to: type=gha,mode=max,scope=swiftcare-patient

      - name: Build and push QueueService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/QueueService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.QUEUE_IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=swiftcare-queue
          cache-to: type=gha,mode=max,scope=swiftcare-queue

  deploy-backend:
    name: Migrate and deploy backend
    needs: images
    if: always() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    environment: azure-development
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_url: ${{ steps.gateway.outputs.url }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      GATEWAY_APP: ${{ vars.AZURE_GATEWAY_APP }}
      AUTH_APP: ${{ vars.AZURE_AUTH_APP }}
      PATIENT_APP: ${{ vars.AZURE_PATIENT_APP }}
      QUEUE_APP: ${{ vars.AZURE_QUEUE_APP }}
      AUTH_MIGRATE_JOB: ${{ vars.AZURE_AUTH_MIGRATE_JOB }}
      PATIENT_MIGRATE_JOB: ${{ vars.AZURE_PATIENT_MIGRATE_JOB }}
      QUEUE_MIGRATE_JOB: ${{ vars.AZURE_QUEUE_MIGRATE_JOB }}
      AUTH_BOOTSTRAP_JOB: ${{ vars.AZURE_AUTH_BOOTSTRAP_JOB }}
      MYSQL_SERVER_NAME: ${{ vars.MYSQL_SERVER_NAME }}
      MYSQL_FQDN: ${{ vars.MYSQL_FQDN }}
      AUTH_DB_USER: ${{ vars.AUTH_DB_USER }}
      PATIENT_DB_USER: ${{ vars.PATIENT_DB_USER }}
      QUEUE_DB_USER: ${{ vars.QUEUE_DB_USER }}
      KAFKA_CONTAINER_GROUP: ${{ vars.KAFKA_CONTAINER_GROUP }}
      KAFKA_CONTAINER: ${{ vars.KAFKA_CONTAINER_NAME }}
      ZOOKEEPER_CONTAINER: ${{ vars.ZOOKEEPER_CONTAINER_NAME }}
      KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
      KAFKA_PATIENT_CHECKED_IN_TOPIC: ${{ vars.KAFKA_PATIENT_CHECKED_IN_TOPIC }}
      KAFKA_QUEUE_CONSUMER_GROUP: ${{ vars.KAFKA_QUEUE_CONSUMER_GROUP }}
      STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      FRONTEND_WWW_ORIGIN: ${{ vars.FRONTEND_WWW_ORIGIN }}
      GATEWAY_ORIGIN: ${{ vars.GATEWAY_ORIGIN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
      PATIENT_DB_PASSWORD: ${{ secrets.PATIENT_DB_PASSWORD }}
      QUEUE_DB_PASSWORD: ${{ secrets.QUEUE_DB_PASSWORD }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      GATEWAY_INTERNAL_SECRET: ${{ secrets.GATEWAY_INTERNAL_SECRET }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_LOCATION AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            RESOURCE_GROUP CONTAINERAPPS_ENVIRONMENT GATEWAY_APP AUTH_APP PATIENT_APP QUEUE_APP
            AUTH_MIGRATE_JOB PATIENT_MIGRATE_JOB QUEUE_MIGRATE_JOB AUTH_BOOTSTRAP_JOB
            MYSQL_SERVER_NAME MYSQL_FQDN
            AUTH_DB_USER AUTH_DB_PASSWORD PATIENT_DB_USER PATIENT_DB_PASSWORD
            QUEUE_DB_USER QUEUE_DB_PASSWORD
            KAFKA_CONTAINER_GROUP KAFKA_CONTAINER ZOOKEEPER_CONTAINER
            KAFKA_BOOTSTRAP_SERVERS KAFKA_PATIENT_CHECKED_IN_TOPIC
            KAFKA_QUEUE_CONSUMER_GROUP STATIC_WEB_APP_NAME
            JWT_ISSUER JWT_AUDIENCE JWT_SIGNING_KEY GATEWAY_INTERNAL_SECRET
            FRONTEND_ORIGIN FRONTEND_WWW_ORIGIN GATEWAY_ORIGIN
            GHCR_USERNAME GHCR_TOKEN
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required deployment configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          for origin_name in FRONTEND_ORIGIN FRONTEND_WWW_ORIGIN GATEWAY_ORIGIN; do
            origin="${!origin_name}"
            if [[ "$origin" == */ ]]; then
              echo "::error::$origin_name must not end with a slash"
              exit 1
            fi

            if [[ "$origin" != https://* ]]; then
              echo "::error::$origin_name must be an HTTPS origin"
              exit 1
            fi
          done

          if [ "$FRONTEND_ORIGIN" = "$FRONTEND_WWW_ORIGIN" ]; then
            echo "::error::FRONTEND_ORIGIN and FRONTEND_WWW_ORIGIN must be different origins"
            exit 1
          fi

          if [[ "$KAFKA_BOOTSTRAP_SERVERS" == *localhost* ]] ||
             [[ "$KAFKA_BOOTSTRAP_SERVERS" == *127.0.0.1* ]] ||
             [[ "$KAFKA_BOOTSTRAP_SERVERS" == *kafka:29092* ]]; then
            echo "::error::KAFKA_BOOTSTRAP_SERVERS must be reachable from Container Apps, not a local Docker address"
            exit 1
          fi

          if [ "${#JWT_SIGNING_KEY}" -lt 32 ]; then
            echo "::error::JWT_SIGNING_KEY must be at least 32 characters"
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the Azure target
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

          normalize_location() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '
          }

          require_location() {
            local resource_name="$1"
            local actual_location
            local expected_location
            actual_location=$(normalize_location "$2")
            expected_location=$(normalize_location "$AZURE_LOCATION")
            if [ "$actual_location" != "$expected_location" ]; then
              echo "::error::$resource_name is in $actual_location; expected $expected_location"
              exit 1
            fi
          }

          actual_subscription=$(az account show --query id --output tsv)
          if [ "$actual_subscription" != "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::OIDC selected an unexpected Azure subscription"
            exit 1
          fi

          group_state=$(az group show --name "$RESOURCE_GROUP" \
            --query properties.provisioningState --output tsv)
          if [ "$group_state" != "Succeeded" ]; then
            echo "::error::Resource group state is $group_state"
            exit 1
          fi

          environment_state=$(az containerapp env show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINERAPPS_ENVIRONMENT" \
            --query properties.provisioningState --output tsv)
          if [ "$environment_state" != "Succeeded" ]; then
            echo "::error::Container Apps environment state is $environment_state"
            exit 1
          fi

          environment_location=$(az containerapp env show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINERAPPS_ENVIRONMENT" \
            --query location --output tsv)
          require_location "Container Apps environment" "$environment_location"

          mysql_state=$(az mysql flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MYSQL_SERVER_NAME" \
            --query state --output tsv)
          if [ "$mysql_state" != "Ready" ]; then
            echo "::error::MySQL state is $mysql_state"
            exit 1
          fi

          mysql_location=$(az mysql flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MYSQL_SERVER_NAME" \
            --query location --output tsv)
          require_location "MySQL flexible server" "$mysql_location"

          actual_mysql_fqdn=$(az mysql flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MYSQL_SERVER_NAME" \
            --query fullyQualifiedDomainName --output tsv)
          if [ "$actual_mysql_fqdn" != "$MYSQL_FQDN" ]; then
            echo "::error::MYSQL_FQDN does not match $MYSQL_SERVER_NAME"
            exit 1
          fi

          public_access=$(az mysql flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MYSQL_SERVER_NAME" \
            --query network.publicNetworkAccess --output tsv)
          if [ "$public_access" != "Disabled" ]; then
            echo "::error::MySQL public access is $public_access; expected Disabled"
            exit 1
          fi

          messaging_state=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$KAFKA_CONTAINER_GROUP" \
            --query instanceView.state --output tsv)
          if [ "$messaging_state" != "Running" ]; then
            echo "::error::Kafka/ZooKeeper container group state is $messaging_state"
            exit 1
          fi

          messaging_location=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$KAFKA_CONTAINER_GROUP" \
            --query location --output tsv)
          require_location "Kafka/ZooKeeper container group" "$messaging_location"

          messaging_ip_type=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$KAFKA_CONTAINER_GROUP" \
            --query ipAddress.type --output tsv)
          if [ "$messaging_ip_type" != "Private" ]; then
            echo "::error::Kafka/ZooKeeper must use a private VNet address; found $messaging_ip_type"
            exit 1
          fi

          for container_name in "$ZOOKEEPER_CONTAINER" "$KAFKA_CONTAINER"; do
            container_state=$(az container show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$KAFKA_CONTAINER_GROUP" \
              --query "containers[?name=='$container_name'].instanceView.currentState.state | [0]" \
              --output tsv)
            if [ "$container_state" != "Running" ]; then
              echo "::error::$container_name container state is ${container_state:-Missing}; expected Running"
              exit 1
            fi
          done

          kafka_zookeeper=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$KAFKA_CONTAINER_GROUP" \
            --query "containers[?name=='$KAFKA_CONTAINER'] | [0].environmentVariables[?name=='KAFKA_ZOOKEEPER_CONNECT'].value | [0]" \
            --output tsv)
          if [ "$kafka_zookeeper" != "localhost:2181" ]; then
            echo "::error::Kafka must use the ZooKeeper container at localhost:2181; found ${kafka_zookeeper:-no setting}"
            exit 1
          fi

          static_app_location=$(az staticwebapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STATIC_WEB_APP_NAME" \
            --query location --output tsv)
          require_location "Static Web App" "$static_app_location"

      - name: Resolve protected configuration
        shell: bash
        run: |
          set -euo pipefail
          auth_connection="Server=${MYSQL_FQDN};Port=3306;Database=swiftcare_auth;User Id=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD};SslMode=Required;"
          patient_connection="Server=${MYSQL_FQDN};Port=3306;Database=swiftcare_patient;User Id=${PATIENT_DB_USER};Password=${PATIENT_DB_PASSWORD};SslMode=Required;"
          queue_connection="Server=${MYSQL_FQDN};Port=3306;Database=swiftcare_queue;User Id=${QUEUE_DB_USER};Password=${QUEUE_DB_PASSWORD};SslMode=Required;"

          echo "::add-mask::$auth_connection"
          echo "::add-mask::$patient_connection"
          echo "::add-mask::$queue_connection"
          {
            echo "AUTH_DB_CONNECTION=$auth_connection"
            echo "PATIENT_DB_CONNECTION=$patient_connection"
            echo "QUEUE_DB_CONNECTION=$queue_connection"
          } >> "$GITHUB_ENV"

      - name: Configure the AuthService migration job
        shell: bash
        run: |
          set -euo pipefail
          image="$AUTH_IMAGE:$DEPLOY_SHA"

          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" >/dev/null 2>&1; then
            az containerapp job registry set \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp job secret set \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
              --secrets "auth-db=$AUTH_DB_CONNECTION" \
              --only-show-errors >/dev/null
            az containerapp job update \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --set-env-vars "ConnectionStrings__AuthDb=secretref:auth-db" \
              --only-show-errors >/dev/null
          else
            az containerapp job create \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 600 --replica-retry-limit 1 \
              --replica-completion-count 1 --parallelism 1 \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --secrets "auth-db=$AUTH_DB_CONNECTION" \
              --env-vars "ConnectionStrings__AuthDb=secretref:auth-db" \
              --only-show-errors >/dev/null
          fi

      - name: Apply AuthService database migrations inside the VNet
        shell: bash
        run: |
          set -euo pipefail
          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
            --query name --output tsv)
          echo "Started migration execution $execution"

          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_MIGRATE_JOB" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv 2>/dev/null || true)
            case "$status" in
              Succeeded)
                echo "AuthService migration succeeded."
                exit 0
                ;;
              Failed|Degraded)
                echo "::error::AuthService migration execution ended with $status"
                exit 1
                ;;
              *)
                echo "AuthService migration status: ${status:-Pending} (attempt $attempt/60)"
                sleep 10
                ;;
            esac
          done

          echo "::error::AuthService migration execution timed out after 10 minutes"
          exit 1

      - name: Configure the PatientService migration job
        shell: bash
        run: |
          set -euo pipefail
          image="$PATIENT_IMAGE:$DEPLOY_SHA"

          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" >/dev/null 2>&1; then
            az containerapp job registry set \
              --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp job secret set \
              --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
              --secrets "patient-db=$PATIENT_DB_CONNECTION" \
              --only-show-errors >/dev/null
            az containerapp job update \
              --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --set-env-vars "ConnectionStrings__PatientDb=secretref:patient-db" \
              --only-show-errors >/dev/null
          else
            az containerapp job create \
              --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 600 --replica-retry-limit 1 \
              --replica-completion-count 1 --parallelism 1 \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --secrets "patient-db=$PATIENT_DB_CONNECTION" \
              --env-vars "ConnectionStrings__PatientDb=secretref:patient-db" \
              --only-show-errors >/dev/null
          fi

      - name: Apply PatientService database migrations inside the VNet
        shell: bash
        run: |
          set -euo pipefail
          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
            --query name --output tsv)
          echo "Started PatientService migration execution $execution"

          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" --name "$PATIENT_MIGRATE_JOB" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv 2>/dev/null || true)
            case "$status" in
              Succeeded)
                echo "PatientService migration succeeded."
                exit 0
                ;;
              Failed|Degraded)
                echo "::error::PatientService migration execution ended with $status"
                exit 1
                ;;
              *)
                echo "PatientService migration status: ${status:-Pending} (attempt $attempt/60)"
                sleep 10
                ;;
            esac
          done

          echo "::error::PatientService migration execution timed out after 10 minutes"
          exit 1

      - name: Configure the QueueService migration job
        shell: bash
        run: |
          set -euo pipefail
          image="$QUEUE_IMAGE:$DEPLOY_SHA"

          if az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" >/dev/null 2>&1; then
            az containerapp job registry set \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp job secret set \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --secrets "queue-db=$QUEUE_DB_CONNECTION" \
              --only-show-errors >/dev/null
            az containerapp job update \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --set-env-vars "ConnectionStrings__QueueDb=secretref:queue-db" \
              --only-show-errors >/dev/null
          else
            az containerapp job create \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 600 --replica-retry-limit 1 \
              --replica-completion-count 1 --parallelism 1 \
              --image "$image" --args=--migrate \
              --cpu 0.25 --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --secrets "queue-db=$QUEUE_DB_CONNECTION" \
              --env-vars "ConnectionStrings__QueueDb=secretref:queue-db" \
              --only-show-errors >/dev/null
          fi

      - name: Apply QueueService database migrations inside the VNet
        shell: bash
        run: |
          set -euo pipefail
          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
            --query name --output tsv)
          echo "Started QueueService migration execution $execution"

          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv 2>/dev/null || true)
            case "$status" in
              Succeeded)
                echo "QueueService migration succeeded."
                exit 0
                ;;
              Failed|Degraded)
                echo "::error::QueueService migration execution ended with $status"
                exit 1
                ;;
              *)
                echo "QueueService migration status: ${status:-Pending} (attempt $attempt/60)"
                sleep 10
                ;;
            esac
          done

          echo "::error::QueueService migration execution timed out after 10 minutes"
          exit 1

      - name: Bootstrap the initial administrator
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_admin
        shell: bash
        env:
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          INITIAL_ADMIN_FULL_NAME: ${{ vars.INITIAL_ADMIN_FULL_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$INITIAL_ADMIN_USERNAME" ] || [ -z "$INITIAL_ADMIN_PASSWORD" ]; then
            echo "::error::INITIAL_ADMIN_USERNAME and INITIAL_ADMIN_PASSWORD are required for bootstrap"
            exit 1
          fi

          if [ "${#INITIAL_ADMIN_PASSWORD}" -lt 8 ]; then
            echo "::error::INITIAL_ADMIN_PASSWORD must be at least 8 characters"
            exit 1
          fi

          cleanup_bootstrap_job() {
            if az containerapp job show \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_BOOTSTRAP_JOB" \
              >/dev/null 2>&1; then
              az containerapp job delete \
                --resource-group "$RESOURCE_GROUP" --name "$AUTH_BOOTSTRAP_JOB" \
                --yes --only-show-errors
            fi
          }

          # Delete the one-time credentials even if creation, execution, or polling fails.
          trap cleanup_bootstrap_job EXIT
          cleanup_bootstrap_job

          az containerapp job create \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_BOOTSTRAP_JOB" \
            --environment "$CONTAINERAPPS_ENVIRONMENT" \
            --trigger-type Manual \
            --replica-timeout 600 --replica-retry-limit 0 \
            --replica-completion-count 1 --parallelism 1 \
            --image "$AUTH_IMAGE:$DEPLOY_SHA" --args=--bootstrap-admin \
            --cpu 0.25 --memory 0.5Gi \
            --registry-server ghcr.io \
            --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
            --secrets \
              "auth-db=$AUTH_DB_CONNECTION" \
              "admin-username=$INITIAL_ADMIN_USERNAME" \
              "admin-password=$INITIAL_ADMIN_PASSWORD" \
            --env-vars \
              "ConnectionStrings__AuthDb=secretref:auth-db" \
              "INITIAL_ADMIN_USERNAME=secretref:admin-username" \
              "INITIAL_ADMIN_PASSWORD=secretref:admin-password" \
              "INITIAL_ADMIN_FULL_NAME=$INITIAL_ADMIN_FULL_NAME" \
            --only-show-errors >/dev/null

          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_BOOTSTRAP_JOB" \
            --query name --output tsv)
          result=TimedOut

          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_BOOTSTRAP_JOB" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv 2>/dev/null || true)
            if [ "$status" = "Succeeded" ]; then
              result=Succeeded
              break
            fi
            if [ "$status" = "Failed" ] || [ "$status" = "Degraded" ]; then
              result="$status"
              break
            fi
            sleep 10
          done

          if [ "$result" != "Succeeded" ]; then
            echo "::error::Administrator bootstrap ended with $result"
            exit 1
          fi

          cleanup_bootstrap_job
          trap - EXIT
          echo "Initial administrator is present. Bootstrap job removed."

      - name: Deploy AuthService with internal ingress
        shell: bash
        run: |
          set -euo pipefail
          image="$AUTH_IMAGE:$DEPLOY_SHA"

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" >/dev/null 2>&1; then
            az containerapp registry set \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp secret set \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
              --secrets \
                "auth-db=$AUTH_DB_CONNECTION" \
                "jwt-key=$JWT_SIGNING_KEY" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --only-show-errors >/dev/null
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
              --image "$image" --cpu 0.25 --memory 0.5Gi \
              --min-replicas 0 --max-replicas 1 \
              --set-env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:5000" \
                "ConnectionStrings__AuthDb=secretref:auth-db" \
                "Jwt__SecretKey=secretref:jwt-key" \
