      - name: Deploy QueueService as a private background worker
        shell: bash
        run: |
          set -euo pipefail
          image="$QUEUE_IMAGE:$DEPLOY_SHA"

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" >/dev/null 2>&1; then
            az containerapp registry set \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp secret set \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --secrets \
                "queue-db=$QUEUE_DB_CONNECTION" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --only-show-errors >/dev/null
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --image "$image" --cpu 0.25 --memory 0.5Gi \
              --min-replicas 1 --max-replicas 1 \
              --set-env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:5003" \
                "ConnectionStrings__QueueDb=secretref:queue-db" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Kafka__BootstrapServers=$KAFKA_BOOTSTRAP_SERVERS" \
                "Kafka__PatientCheckedInTopic=$KAFKA_PATIENT_CHECKED_IN_TOPIC" \
                "Kafka__ConsumerGroupId=$KAFKA_QUEUE_CONSUMER_GROUP" \
              --only-show-errors >/dev/null
          else
            az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$image" \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 1 --max-replicas 1 \
              --secrets \
                "queue-db=$QUEUE_DB_CONNECTION" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:5003" \
                "ConnectionStrings__QueueDb=secretref:queue-db" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Kafka__BootstrapServers=$KAFKA_BOOTSTRAP_SERVERS" \
                "Kafka__PatientCheckedInTopic=$KAFKA_PATIENT_CHECKED_IN_TOPIC" \
                "Kafka__ConsumerGroupId=$KAFKA_QUEUE_CONSUMER_GROUP" \
              --only-show-errors >/dev/null
          fi

          ingress_external=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
            --query properties.configuration.ingress.external --output tsv)
          if [ -n "$ingress_external" ]; then
            az containerapp ingress disable \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --only-show-errors >/dev/null
          fi

          az containerapp revision set-mode \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
            --mode single --only-show-errors >/dev/null

          running_status=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
            --query properties.runningStatus --output tsv)
          if [ "$running_status" = "Stopped" ]; then
            app_id=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --query id --output tsv)
            az rest \
              --method post \
              --uri "https://management.azure.com${app_id}/start?api-version=2026-01-01" \
              --output none
            echo "Start requested for $QUEUE_APP."
          fi

          for attempt in $(seq 1 60); do
            app_state=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --query "{running:properties.runningStatus,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName}" \
              --output json)
            running=$(jq -r '.running // empty' <<< "$app_state")
            latest=$(jq -r '.latest // empty' <<< "$app_state")
            ready=$(jq -r '.ready // empty' <<< "$app_state")

            if [ "$running" = "Running" ] && [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              ingress=$(az containerapp show \
                --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
                --query properties.configuration.ingress --output json)
              if [ -n "$ingress" ] && [ "$ingress" != "null" ]; then
                echo "::error::QueueService must not expose ingress"
                exit 1
              fi

              echo "QueueService revision $ready is ready without ingress."
              exit 0
            fi

            echo "QueueService running=${running:-Unknown} latest=${latest:-Missing} ready=${ready:-Pending}; attempt $attempt/60"
            sleep 5
          done

          echo "::error::QueueService did not become ready within 5 minutes"
          exit 1

      - name: Collect QueueService deployment diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if az containerapp job show \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
            >/dev/null 2>&1; then
            echo "QueueService migration executions:"
            az containerapp job execution list \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_MIGRATE_JOB" \
              --query "[:5].{name:name,status:properties.status,start:properties.startTime,end:properties.endTime}" \
              --output table
          fi

          if az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
            >/dev/null 2>&1; then
            echo "QueueService application state:"
            az containerapp show \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --query "{running:properties.runningStatus,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName}" \
              --output yaml

            echo "QueueService revisions:"
            az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --query "[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas}" \
              --output table

            echo "QueueService application logs:"
            az containerapp logs show \
              --resource-group "$RESOURCE_GROUP" --name "$QUEUE_APP" \
              --tail 100 --format text
          fi

      - name: Deploy the gateway last
        id: gateway
        shell: bash
        run: |
          set -euo pipefail

          start_container_app() {
            local app_name="$1"
            local app_id
            local running_status

            running_status=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" --name "$app_name" \
              --query properties.runningStatus --output tsv)

            if [ "$running_status" = "Stopped" ]; then
              app_id=$(az containerapp show \
                --resource-group "$RESOURCE_GROUP" --name "$app_name" \
                --query id --output tsv)
              az rest \
                --method post \
                --uri "https://management.azure.com${app_id}/start?api-version=2026-01-01" \
                --output none
              echo "Start requested for $app_name."
            fi

            for attempt in $(seq 1 60); do
              running_status=$(az containerapp show \
                --resource-group "$RESOURCE_GROUP" --name "$app_name" \
                --query properties.runningStatus --output tsv)
              if [ "$running_status" = "Running" ]; then
                echo "$app_name is running."
                return 0
              fi

              echo "$app_name state is ${running_status:-Unknown}; attempt $attempt/60"
              sleep 5
            done

            echo "::error::$app_name did not enter the Running state"
            return 1
          }

          start_container_app "$AUTH_APP"
          start_container_app "$PATIENT_APP"

          auth_fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          if [ -z "$auth_fqdn" ]; then
            echo "::error::AuthService has no internal ingress FQDN"
            exit 1
          fi

          patient_fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$PATIENT_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          if [ -z "$patient_fqdn" ]; then
            echo "::error::PatientService has no internal ingress FQDN"
            exit 1
          fi

          image="$GATEWAY_IMAGE:$DEPLOY_SHA"
          auth_proxy_address="https://${auth_fqdn}"
          patient_proxy_address="https://${patient_fqdn}"

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" >/dev/null 2>&1; then
            az containerapp registry set \
              --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
              --server ghcr.io --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
              --only-show-errors >/dev/null
            az containerapp secret set \
              --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
              --secrets \
                "jwt-key=$JWT_SIGNING_KEY" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --only-show-errors >/dev/null
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
              --image "$image" --cpu 0.25 --memory 0.5Gi \
              --min-replicas 0 --max-replicas 1 \
              --set-env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:8000" \
                "Jwt__SecretKey=secretref:jwt-key" \
                "Jwt__Issuer=$JWT_ISSUER" \
                "Jwt__Audience=$JWT_AUDIENCE" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Cors__AllowedOrigins__0=$FRONTEND_ORIGIN" \
                "Cors__AllowedOrigins__1=$FRONTEND_WWW_ORIGIN" \
                "ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address=$auth_proxy_address" \
                "ReverseProxy__Clusters__patient-cluster__Destinations__patient-destination__Address=$patient_proxy_address" \
              --only-show-errors >/dev/null
          else
            az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$image" \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --ingress external --target-port 8000 \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 0 --max-replicas 1 \
              --secrets \
                "jwt-key=$JWT_SIGNING_KEY" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:8000" \
                "Jwt__SecretKey=secretref:jwt-key" \
                "Jwt__Issuer=$JWT_ISSUER" \
                "Jwt__Audience=$JWT_AUDIENCE" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Cors__AllowedOrigins__0=$FRONTEND_ORIGIN" \
                "Cors__AllowedOrigins__1=$FRONTEND_WWW_ORIGIN" \
                "ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address=$auth_proxy_address" \
                "ReverseProxy__Clusters__patient-cluster__Destinations__patient-destination__Address=$patient_proxy_address" \
              --only-show-errors >/dev/null
          fi

          az containerapp ingress enable \
            --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
            --type external --target-port 8000 --transport auto \
            --only-show-errors >/dev/null
          az containerapp revision set-mode \
            --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
            --mode single --only-show-errors >/dev/null

          start_container_app "$GATEWAY_APP"

          fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$GATEWAY_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          if [ -z "$fqdn" ]; then
            echo "::error::Gateway has no public ingress FQDN"
            exit 1
          fi

          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test health and service routing
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "$GATEWAY_URL/health" || true)
            if [ "$code" = "200" ]; then
              health_ok=true
              break
            fi
            echo "Gateway health returned ${code:-no response}; attempt $attempt/30"
            sleep 10
          done

          if [ "$health_ok" != "true" ]; then
            echo "::error::Gateway health check never returned 200"
            exit 1
          fi

          auth_ok=false
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 \
              --header 'Content-Type: application/json' \
              --data '{"username":"deployment-smoke-test","password":"invalid"}' \
              "$GATEWAY_URL/api/auth/login" || true)
            if [ "$code" = "401" ]; then
              auth_ok=true
              break
            fi
            echo "Auth route returned ${code:-no response}; attempt $attempt/30"
            sleep 10
          done

          if [ "$auth_ok" != "true" ]; then
            echo "::error::Gateway could not reach a healthy AuthService"
            exit 1
          fi

          patient_token=$(
            python3 <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          import uuid

          def encode(value):
              serialized = json.dumps(value, separators=(",", ":")).encode()
              return base64.urlsafe_b64encode(serialized).rstrip(b"=").decode()

          now = int(time.time())
          header = encode({"alg": "HS256", "typ": "JWT"})
          payload = encode({
              "sub": "00000000-0000-0000-0000-000000000000",
              "jti": str(uuid.uuid4()),
              "role": "Receptionist",
              "iss": os.environ["JWT_ISSUER"],
              "aud": os.environ["JWT_AUDIENCE"],
              "iat": now,
              "nbf": now,
              "exp": now + 300
          })
          unsigned = f"{header}.{payload}"
          signature = hmac.new(
              os.environ["JWT_SIGNING_KEY"].encode(),
              unsigned.encode(),
              hashlib.sha256).digest()
          encoded_signature = base64.urlsafe_b64encode(signature).rstrip(b"=").decode()
          print(f"{unsigned}.{encoded_signature}")
          PY
          )

          patient_ok=false
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 \
              --header "Authorization: Bearer $patient_token" \
              "$GATEWAY_URL/api/patients/search?q=deployment-connectivity-check" || true)
            if [ "$code" = "200" ]; then
              patient_ok=true
              break
            fi
            echo "Patient route returned ${code:-no response}; attempt $attempt/30"
            sleep 10
          done

          if [ "$patient_ok" != "true" ]; then
            echo "::error::Gateway could not reach a healthy PatientService"
            exit 1
          fi

          echo "Gateway health, AuthService routing, and PatientService routing passed."

  deploy-frontend:
    name: Build and deploy frontend
    needs: deploy-backend
    if: always() && needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    environment: azure-development
    steps:
      - name: Check out the deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build against the deployed gateway
        working-directory: frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_GATEWAY_URL" ]; then
            echo "::error::GATEWAY_ORIGIN is not configured"
            exit 1
          fi
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Publish deployment summary
        env:
          AZURE_GATEWAY_URL: ${{ needs.deploy-backend.outputs.gateway_url }}
          GATEWAY_ORIGIN: ${{ vars.GATEWAY_ORIGIN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          FRONTEND_WWW_ORIGIN: ${{ vars.FRONTEND_WWW_ORIGIN }}
        run: |
          {
            echo "## Azure development deployment"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Gateway: $GATEWAY_ORIGIN"
            echo "- Azure Gateway endpoint: $AZURE_GATEWAY_URL"
            echo "- Frontend: $FRONTEND_ORIGIN"
            echo "- Frontend (www): $FRONTEND_WWW_ORIGIN"
            echo "- Gateway, AuthService, PatientService, and QueueService images use the same immutable commit tag."
          } >> "$GITHUB_STEP_SUMMARY"
