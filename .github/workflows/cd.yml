name: CD

run-name: Deploy SwiftCare to Azure development

# Releases only what changed. The plan job compares each Container App's running commit (and the
# frontend's published commit) with the release commit, then builds, migrates, deploys, smoke
# tests and, if needed, rolls back each selected service in its own job. Scripts and the service
# list live in deployment/cd. See docs in README.md for the manual options.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: What to release - changed (default), all, or one deployable
        required: false
        default: changed
        type: choice
        options:
          - changed
          - all
          - auth
          - patient
          - queue
          - medical-record
          - prescription
          - gateway
          - frontend
      plan_only:
        description: Show what would be released and change nothing in Azure
        required: false
        default: false
        type: boolean
      bootstrap_admin:
        description: Create the initial production administrator, then remove the bootstrap job
        required: false
        default: false
        type: boolean
      rollback_drill:
        description: Evidence only - force this deployable's smoke check to fail so its rollback is shown
        required: false
        default: none
        type: choice
        options:
          - none
          - auth
          - patient
          - queue
          - medical-record
          - prescription
          - gateway

permissions:
  contents: read

# Every branch deploys to the same development resources. Serializing the whole
# environment prevents two manually selected branches from racing each other.
concurrency:
  group: azure-development-deployment
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}

jobs:
  manual-quality-gate:
    name: Run CI for a manually selected branch
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  plan:
    name: Select what to release
    needs: manual-quality-gate
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality-gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-development
    permissions:
      contents: read
      id-token: write
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
      auth: ${{ steps.select.outputs.auth }}
      auth_matrix: ${{ steps.select.outputs.auth_matrix }}
      services_matrix: ${{ steps.select.outputs.services_matrix }}
      services_count: ${{ steps.select.outputs.services_count }}
      gateway: ${{ steps.select.outputs.gateway }}
      frontend: ${{ steps.select.outputs.frontend }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_GATEWAY_APP: ${{ vars.AZURE_GATEWAY_APP }}
      AZURE_AUTH_APP: ${{ vars.AZURE_AUTH_APP }}
      AZURE_PATIENT_APP: ${{ vars.AZURE_PATIENT_APP }}
      AZURE_QUEUE_APP: ${{ vars.AZURE_QUEUE_APP }}
      AZURE_MEDICAL_RECORD_APP: ${{ vars.AZURE_MEDICAL_RECORD_APP }}
      AZURE_PRESCRIPTION_APP: ${{ vars.AZURE_PRESCRIPTION_APP }}
      STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      MYSQL_SERVER_NAME: ${{ vars.MYSQL_SERVER_NAME }}
      MYSQL_FQDN: ${{ vars.MYSQL_FQDN }}
      KAFKA_CONTAINER_GROUP: ${{ vars.KAFKA_CONTAINER_GROUP }}
      KAFKA_CONTAINER: ${{ vars.KAFKA_CONTAINER_NAME }}
      ZOOKEEPER_CONTAINER: ${{ vars.ZOOKEEPER_CONTAINER_NAME }}
      KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'changed' }}
      BOOTSTRAP_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_admin || false }}
      ROLLBACK_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill || 'none' }}
    steps:
      - name: Check out the release commit with its history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Validate configuration
        run: bash deployment/cd/validate-config.sh plan

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the Azure target
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          bash deployment/cd/verify-target.sh azure

      - name: Read what is running now
        run: bash deployment/cd/read-state.sh "$RUNNER_TEMP/state.json"

      - name: Select the deployables to release
        id: select
        run: |
          set -euo pipefail
          args=(
            --state "$RUNNER_TEMP/state.json"
            --release-sha "$DEPLOY_SHA"
            --mode "$RELEASE_MODE"
            --output "$RUNNER_TEMP/selection.json"
            --summary "$GITHUB_STEP_SUMMARY"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$BOOTSTRAP_ADMIN" = "true" ]; then args+=(--bootstrap-admin); fi
          python3 -I -B deployment/cd/select_services.py "${args[@]}"

      - name: Check the rollback drill target
        if: env.ROLLBACK_DRILL != 'none'
        run: |
          set -euo pipefail
          if ! jq -e --arg key "$ROLLBACK_DRILL" \
            '.rows[] | select(.key == $key and .decision == "Release")' \
            "$RUNNER_TEMP/selection.json" >/dev/null; then
            echo "::error::rollback_drill names $ROLLBACK_DRILL, which is not part of this release"
            exit 1
          fi

      - name: Verify the data layer
        if: steps.select.outputs.images_count != '0' && !inputs.plan_only
        run: bash deployment/cd/verify-target.sh data

      - name: Keep the selection for the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-selection
          path: ${{ runner.temp }}/selection.json
          if-no-files-found: warn
          overwrite: true

  # AuthService goes first: the gateway checks every session with it and every smoke check
  # signs in through it.
  deploy-auth:
    name: Release ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.auth == 'true' && !inputs.plan_only
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.auth_matrix || '{"include":[]}') }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      key: ${{ matrix.key }}
      name: ${{ matrix.name }}
      app_var: ${{ matrix.app_var }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      migrate_job_var: ${{ matrix.migrate_job_var }}
      db_user_var: ${{ matrix.db_user_var }}
      db_password_var: ${{ matrix.db_password_var }}
      release_sha: ${{ needs.plan.outputs.release_sha }}
      bootstrap_admin: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_admin || false }}
      rollback_drill: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill || 'none' }}

  deploy-services:
    name: Release ${{ matrix.name }}
    needs: [plan, deploy-auth]
    if: >-
      always() && needs.plan.result == 'success' && !inputs.plan_only &&
      needs.plan.outputs.services_count != '0' &&
      (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.services_matrix || '{"include":[]}') }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      key: ${{ matrix.key }}
      name: ${{ matrix.name }}
      app_var: ${{ matrix.app_var }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      migrate_job_var: ${{ matrix.migrate_job_var }}
      db_user_var: ${{ matrix.db_user_var }}
      db_password_var: ${{ matrix.db_password_var }}
      release_sha: ${{ needs.plan.outputs.release_sha }}
      rollback_drill: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill || 'none' }}

  gateway-image:
    name: Build ApiGateway image
    needs: plan
    if: needs.plan.outputs.gateway == 'true' && !inputs.plan_only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ApiGateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ApiGateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/swiftcare-gateway:${{ needs.plan.outputs.release_sha }}
          cache-from: type=gha,scope=swiftcare-gateway
          cache-to: type=gha,mode=max,scope=swiftcare-gateway

  # The gateway is released last and only when no selected service failed, so it never routes to a
  # service that was rolled back or left unhealthy. Its smoke check exercises every service.
  deploy-gateway:
    name: Release the gateway
    needs: [plan, gateway-image, deploy-auth, deploy-services]
    if: >-
      always() && needs.plan.result == 'success' && !inputs.plan_only &&
      needs.plan.outputs.gateway == 'true' && needs.gateway-image.result == 'success' &&
      (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped') &&
      (needs.deploy-services.result == 'success' || needs.deploy-services.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure-development
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_url: ${{ steps.gateway.outputs.url }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_GATEWAY_APP: ${{ vars.AZURE_GATEWAY_APP }}
      AZURE_AUTH_APP: ${{ vars.AZURE_AUTH_APP }}
      AZURE_PATIENT_APP: ${{ vars.AZURE_PATIENT_APP }}
      AZURE_QUEUE_APP: ${{ vars.AZURE_QUEUE_APP }}
      AZURE_MEDICAL_RECORD_APP: ${{ vars.AZURE_MEDICAL_RECORD_APP }}
      AZURE_PRESCRIPTION_APP: ${{ vars.AZURE_PRESCRIPTION_APP }}
      DEPLOY_SHA: ${{ needs.plan.outputs.release_sha }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      GATEWAY_INTERNAL_SECRET: ${{ secrets.GATEWAY_INTERNAL_SECRET }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      FRONTEND_WWW_ORIGIN: ${{ vars.FRONTEND_WWW_ORIGIN }}
      # Optional: services skip telemetry until this secret is set in the environment.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      SMOKE_RECEPTIONIST_USERNAME: ${{ secrets.SMOKE_RECEPTIONIST_USERNAME }}
      SMOKE_RECEPTIONIST_PASSWORD: ${{ secrets.SMOKE_RECEPTIONIST_PASSWORD }}
      SMOKE_DOCTOR_USERNAME: ${{ secrets.SMOKE_DOCTOR_USERNAME }}
      SMOKE_DOCTOR_PASSWORD: ${{ secrets.SMOKE_DOCTOR_PASSWORD }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          sparse-checkout: deployment/cd

      - name: Validate configuration
        run: bash deployment/cd/validate-config.sh gateway

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Add the Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture the running image for rollback
        id: previous
        env:
          SERVICE_KEY: gateway
        run: bash deployment/cd/capture-previous.sh "$SERVICE_KEY"

      - name: Deploy the gateway
        id: gateway
        run: bash deployment/cd/deploy-gateway.sh

      - name: Smoke test every service through the gateway
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          SMOKE_FORCE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill || 'none' }}
        run: bash deployment/cd/smoke.sh gateway

      - name: Roll back the gateway only
        id: rollback
        if: failure() && steps.gateway.outcome != 'skipped'
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.previous_image }}
        run: |
          bash deployment/cd/rollback-service.sh gateway "$PREVIOUS_IMAGE"
          echo "::error::The gateway failed its release and was rolled back. Services were not touched."

      - name: Smoke test again after the rollback
        id: after_rollback
        if: failure() && steps.rollback.outcome == 'success' && steps.rollback.outputs.rollback == 'done'
        continue-on-error: true
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
        run: bash deployment/cd/smoke.sh gateway

      - name: Record the result
        if: always()
        env:
          KEY: gateway
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.gateway.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_RESULT: ${{ steps.rollback.outputs.rollback }}
          POST_ROLLBACK_SMOKE: ${{ steps.after_rollback.outcome }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.previous_image }}
        run: bash deployment/cd/record-result.sh "$RUNNER_TEMP/result"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result-gateway
          path: ${{ runner.temp }}/result/gateway.json
          if-no-files-found: warn
          overwrite: true

  # The frontend is released separately and only after the backend jobs it follows have
  # succeeded or been skipped.
  deploy-frontend:
    name: Build and deploy frontend
    needs: [plan, deploy-auth, deploy-services, gateway-image, deploy-gateway]
    if: >-
      always() && needs.plan.result == 'success' && !inputs.plan_only &&
      needs.plan.outputs.frontend == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-development
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.release_sha }}
      GATEWAY_ORIGIN: ${{ vars.GATEWAY_ORIGIN }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      FRONTEND_WWW_ORIGIN: ${{ vars.FRONTEND_WWW_ORIGIN }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}

      - name: Validate configuration
        run: bash deployment/cd/validate-config.sh frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build against the deployed gateway
        id: build
        working-directory: frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_ORIGIN }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # The next release reads this file to learn which commit the site runs.
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > dist/version.json

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Record the result
        if: always()
        env:
          KEY: frontend
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: n/a
        run: bash deployment/cd/record-result.sh "$RUNNER_TEMP/result"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result-frontend
          path: ${{ runner.temp }}/result/frontend.json
          if-no-files-found: warn
          overwrite: true

  summary:
    name: Release summary
    needs: [plan, deploy-auth, deploy-services, gateway-image, deploy-gateway, deploy-frontend]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          sparse-checkout: deployment/cd

      - name: Download the selection and each result
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/artifacts

      - name: Publish the release summary
        env:
          PLAN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only || false }}
        run: |
          set -euo pipefail
          args=(--selection "$RUNNER_TEMP/artifacts/release-selection/selection.json")
          if [ "$PLAN_ONLY" = "true" ]; then args+=(--plan-only); else args+=(--results "$RUNNER_TEMP/results"); fi
          mkdir -p "$RUNNER_TEMP/results"
          for dir in "$RUNNER_TEMP"/artifacts/release-result-*; do
            if [ -d "$dir" ]; then cp "$dir"/*.json "$RUNNER_TEMP/results/"; fi
          done
          python3 -I -B deployment/cd/render_summary.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
