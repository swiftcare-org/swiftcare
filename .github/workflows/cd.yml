                "Jwt__Audience=$JWT_AUDIENCE" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Kafka__BootstrapServers=$KAFKA_BOOTSTRAP_SERVERS" \
              --only-show-errors >/dev/null
          else
            az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$image" \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_TOKEN" \
              --ingress internal --target-port 5000 \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 0 --max-replicas 1 \
              --secrets \
                "auth-db=$AUTH_DB_CONNECTION" \
                "jwt-key=$JWT_SIGNING_KEY" \
                "gateway-secret=$GATEWAY_INTERNAL_SECRET" \
              --env-vars \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ASPNETCORE_URLS=http://+:5000" \
                "ConnectionStrings__AuthDb=secretref:auth-db" \
                "Jwt__SecretKey=secretref:jwt-key" \
                "Jwt__Issuer=$JWT_ISSUER" \
                "Jwt__Audience=$JWT_AUDIENCE" \
                "Gateway__InternalSecret=secretref:gateway-secret" \
                "Kafka__BootstrapServers=$KAFKA_BOOTSTRAP_SERVERS" \
              --only-show-errors >/dev/null
          fi

          az containerapp ingress enable \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
            --type internal --target-port 5000 --transport auto \
            --only-show-errors >/dev/null
          az containerapp revision set-mode \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
            --mode single --only-show-errors >/dev/null

          external=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$AUTH_APP" \
            --query properties.configuration.ingress.external --output tsv)
          if [ "$external" != "false" ]; then
            echo "::error::AuthService ingress is not internal"
            exit 1
          fi

      - name: Deploy PatientService with internal ingress
        shell: bash
        run: |
          set -euo pipefail
          image="$PATIENT_IMAGE:$DEPLOY_SHA"

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$PATIENT_APP" >/dev/null 2>&1; then
