# Extra JMeter properties for the SwiftCare load test.
# Pass with:  jmeter -q tests/PerformanceTest/user.properties ...
# or override individually on the command line with -Jname=value.
#
# swiftcare-load.jmx reads these via ${__P(name,default)}:
#
#   host      Gateway host                 (default: localhost)
#   port      Gateway port                 (default: 8000)
#   protocol  http | https                 (default: http)
#   threads    concurrent virtual users    (default: 10)
#   rampup     ramp-up period, seconds     (default: 30)
#   duration   steady-state seconds        (default: 900)
#   thinkdelay Gaussian think-time offset, ms   (default: 1000)
#   thinkrange Gaussian think-time deviation, ms (default: 1500)
#
# ---------------------------------------------------------------------------
# Run profiles (see README.md for the full commands)
#
#   Smoke    -Jthreads=1   -Jrampup=1    -Jduration=60
#   Load     -Jthreads=20  -Jrampup=30   -Jduration=900
#   Stress   -Jthreads=400 -Jrampup=600  -Jduration=600 -Jthinkdelay=300 -Jthinkrange=300
#            run against the CPU/memory-capped stack (docker-compose.perf.yml).
#            Ceiling raised from the original 80 after the Load baseline showed
#            the uncapped system idle at 20 users (read p95 8 ms). Read the knee
#            off the dashboard's "active threads vs latency / error %" series.
# ---------------------------------------------------------------------------
# SWC-126-clinical-flow.jmx (Sprint 3):
#
#   usersDoctor / usersCounter   Doctor workflow / Receptionist counter threads (default 10 / 10)
#   rampUp / duration            seconds (default 30 / 900)
#   stepDelay / stepRange        think time between steps, ms (default 1000 + 0-2000)
#   cycleDelay / cycleRange      pause before the next patient, ms (default 40000 + 0-10000)
#   pollDelay / pollRange        counter screen refresh, ms (default 4500 + 0-1000)
#   counterQueuePoll             false drops the Sprint 2 queue poll from the counter (default true)
#   freeMaxPolls / freePollMs    wait for completion to free the doctor (default 20 polls, 500 ms apart)
#   dispenseAfterMs              prescription age before a receptionist dispenses it (default 30000)
#   readSlaMs / writeSlaMs       Duration Assertion tripwires, the p99 budgets (default 1500 / 3000)
#
#   Smoke   -JusersDoctor=1  -JusersCounter=1  -JrampUp=1  -Jduration=60 -JcycleDelay=5000 -JcycleRange=0 -JdispenseAfterMs=5000
#   Load    -JusersDoctor=10 -JusersCounter=10 -JrampUp=30 -Jduration=900
#   Stress  -JusersDoctor=150 -JusersCounter=150 -JrampUp=600 -Jduration=600 -JstepDelay=100 -JstepRange=200
#           -JcycleDelay=5000 -JcycleRange=5000 -JpollDelay=300 -JpollRange=300 -JdispenseAfterMs=10000
#           capped stack; see README.md for the seed size and the isolated run
# ---------------------------------------------------------------------------

# Keep the on-disk JTL small and dashboard-friendly.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.response_data.on_error=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true

# Report percentiles that match the pass/fail table in TEST-PLAN.md.
aggregate_rpt_pct1=95
aggregate_rpt_pct2=99
aggregate_rpt_pct3=99.9

# Tells a Duration Assertion breach apart from a non-2xx response in the JTL (SWC-126).
jmeter.save.saveservice.assertion_results_failure_message=true
