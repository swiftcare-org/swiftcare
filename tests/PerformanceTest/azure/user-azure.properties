# Extra JMeter properties for the SwiftCare load test - AZURE round (SWC-67).
# Pass with:  jmeter -q tests/PerformanceTest/azure/user-azure.properties ...
# or override individually on the command line with -Jname=value.
#
# This is the additive Azure counterpart to ../local/user.properties. It is identical to
# that file except it points the run at the real Azure Gateway instead of
# localhost:8000. The local file and the local .jmx are untouched.
#
# swiftcare-load-azure.jmx reads these via ${__P(name,default)}:
#
#   host      Gateway host                 -> api.swiftcare.me
#   port      Gateway port                 -> 443
#   protocol  http | https                 -> https
#   threads    Sprint 1 mix, concurrent users  (default: 10; set 0 for a Sprint 2 only run)
#
# SWC-88 added the Sprint 2 groups. Each is sized separately and every one defaults to 0,
# so the SWC-67 command lines above keep their original meaning:
#
#   usersDisplay  SWC-23 public display pollers       (default: 0)
#   usersToday    SWC-20 Receptionist full queue      (default: 0)
#   usersWaiting  SWC-21 Doctor waiting pool          (default: 0)
#   usersConsult  SWC-24 Doctor consultation writes   (default: 0)
#   pollDelay / pollRange  read poll interval, ms     (default: 4500 +/- 1000, the UI cadence)
#   writeDelay / writeRange  consultation pacing, ms  (default: 60000 +/- 15000)
#   readSlaMs   Duration Assertion for the read samplers, ms  (default: 2000, the reads p99 budget)
#   writeSlaMs  Duration Assertion for the write sampler, ms  (default: 3500, the writes p99 budget)
#   rampup     ramp-up period, seconds     (default: 30)
#   duration   steady-state seconds        (default: 900)
#   thinkdelay Gaussian think-time offset, ms   (default: 1000)
#   thinkrange Gaussian think-time deviation, ms (default: 1500)
#
# ---------------------------------------------------------------------------
# Real Azure deployment target (Azure Container Apps, region eastasia).
# api.swiftcare.me -> swiftcare-gateway.jollymoss-1030e513.eastasia.azurecontainerapps.io
host=api.swiftcare.me
port=443
protocol=https
#
# ---------------------------------------------------------------------------
# Run profiles for the Azure round (see TEST-PLAN-AZURE.md section 9 for full commands).
#
#   Smoke    -Jthreads=1   -Jrampup=1    -Jduration=60      (gate for Load)
#   Load     -Jthreads=20  -Jrampup=30   -Jduration=900     (20 users, 15 min steady)
#   Stress   OUT OF SCOPE this round (TEST-PLAN-AZURE.md section 5).
#
# Sprint 2 profiles (SWC-88). Same 20-user peak, split across the four new samplers:
#
#   Smoke  -Jthreads=0 -JusersDisplay=1 -JusersToday=1 -JusersWaiting=1 -JusersConsult=1 -Jrampup=1 -Jduration=60
#   Load   -Jthreads=0 -JusersDisplay=8 -JusersToday=4 -JusersWaiting=4 -JusersConsult=4 -Jrampup=30 -Jduration=900
#
# The consultation sampler consumes data/called-queue.csv, one row per 201, and its group
# ends when the file runs out. Seed more rows, do not raise the write rate.
#
# Warm the scale-to-zero Container Apps before the real Smoke run - the first
# request after idle pays a ~20-25 s cold start.
# ---------------------------------------------------------------------------

# Keep the on-disk JTL small and dashboard-friendly. Identical to ../local/user.properties.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.response_data.on_error=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true

# Report percentiles that match the pass/fail table in TEST-PLAN-AZURE.md.
aggregate_rpt_pct1=95
aggregate_rpt_pct2=99
aggregate_rpt_pct3=99.9

# Keep the assertion failure message in the JTL so a Duration Assertion breach can be told
# apart from a non-2xx response when the error rate is computed (SWC-88).
jmeter.save.saveservice.assertion_results_failure_message=true
